<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 695" width="100%" height="auto" role="img" aria-labelledby="hex-008-title hex-008-desc">
  <title id="hex-008-title">HUD Vectorial Rayos-X (Draft): Movilidad de Cadera en Cuadrupedia (45°) (hex-008) / Quadruped Hip Circumduction (45°)</title>
  <desc id="hex-008-desc">ES: HUD vectorial limpio sobre base 3D Rayos-X WebP + máscara bioluminiscente exacta para Movilidad de Cadera en Cuadrupedia (45°) (hex-008). Zonas canónicas: aductores,gluteo_medio,rodilla. EN: Clean vector HUD over 3D X-Ray WebP base + exact pixel glow mask for Quadruped Hip Circumduction (45°) (hex-008). Canonical targetZones: aductores,gluteo_medio,rodilla.</desc>
  <defs>
    <style>
      .m11-pulse { animation: m11HudPulse 2.1s ease-in-out infinite; }
      @keyframes m11HudPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .m11-pulse { animation: none !important; }
      }
    </style>
  </defs>
  <g id="warning-layer" data-layer="warning-layer">
    <rect x="14" y="10" width="612" height="28" rx="6" fill="#071710" fill-opacity="0.92" stroke="#4CAF7D" stroke-width="1.4"/>
    <circle class="m11-pulse" cx="28" cy="24" r="5" fill="#74F2A7"/>
    <text x="40" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#F5EFE0">MOVILIDAD CADERA 45° // COLUMNA LUMBAR ESTABLE</text>
  </g>
  <g id="muscle-zones" data-layer="muscle-zones" data-canonical-zones="aductores,gluteo_medio,rodilla">
    <rect x="14" y="661" width="612" height="24" rx="5" fill="#071710" fill-opacity="0.92" stroke="#2E5C46" stroke-width="1.1"/>
    <rect id="zone-aductores" data-zone="aductores" class="m11-pulse" x="22" y="663" width="4" height="16" rx="2" fill="#74F2A7"/>
    <rect id="zone-gluteo_medio" data-zone="gluteo_medio" class="m11-pulse" x="26" y="663" width="4" height="16" rx="2" fill="#74F2A7"/>
    <rect id="zone-rodilla" data-zone="rodilla" class="m11-pulse" x="30" y="663" width="4" height="16" rx="2" fill="#74F2A7"/>
    <text x="36" y="677" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#74F2A7">ZONAS: ADUCTORES + GLUTEO_MEDIO + RODILLA</text>
    <text x="618" y="677" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#E88D6D">✕ Evitar: rotar columna lumbar</text>
  </g>
</svg>
