<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 471" width="100%" height="auto" role="img" aria-labelledby="sys-1-title sys-1-desc">
  <title id="sys-1-title">HUD Vectorial Rayos-X (Draft): Plancha Frontal (sys-1) / Forearm Plank</title>
  <desc id="sys-1-desc">ES: HUD vectorial limpio sobre base 3D Rayos-X WebP + máscara bioluminiscente exacta para Plancha Frontal (sys-1). Zonas canónicas: core,estabilizadores_lumbopelvicos. EN: Clean vector HUD over 3D X-Ray WebP base + exact pixel glow mask for Forearm Plank (sys-1). Canonical targetZones: core,estabilizadores_lumbopelvicos.</desc>
  <defs>
    <style>
      .m11-pulse { animation: m11HudPulse 2.1s ease-in-out infinite; }
      @keyframes m11HudPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .m11-pulse { animation: none !important; }
      }
    </style>
  </defs>
  <g id="warning-layer" data-layer="warning-layer">
    <rect x="14" y="10" width="612" height="28" rx="6" fill="#1B3A2D" fill-opacity="0.94" stroke="#4CAF7D" stroke-width="1.4"/>
    <circle class="m11-pulse" cx="28" cy="24" r="5" fill="#4CAF7D"/>
    <text x="40" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#F7F5F0">PLANCHA FRONTAL // CONTRACCIÓN ISOMÉTRICA · ALINEACIÓN 180°</text>
  </g>
  <g id="muscle-zones" data-layer="muscle-zones" data-canonical-zones="core,estabilizadores_lumbopelvicos">
    <rect x="14" y="437" width="612" height="24" rx="5" fill="#1B3A2D" fill-opacity="0.94" stroke="#2E7D52" stroke-width="1.1"/>
    <rect id="zone-core" data-zone="core" class="m11-pulse" x="22" y="439" width="4" height="16" rx="2" fill="#4CAF7D"/>
    <rect id="zone-estabilizadores_lumbopelvicos" data-zone="estabilizadores_lumbopelvicos" class="m11-pulse" x="26" y="439" width="4" height="16" rx="2" fill="#4CAF7D"/>
    <text x="36" y="453" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#D4A843">ZONAS: CORE + ESTABILIZADORES_LUMBOPELVICOS</text>
    <text x="618" y="453" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#C85A32">✕ Evitar: hiperlordosis lumbar</text>
  </g>
</svg>
